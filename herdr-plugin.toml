id = "claude-usage"
name = "Claude Usage"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Display Claude API usage at the bottom of Herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "install"]
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "run", "build"]
platforms = ["linux", "macos"]

[[panes]]
id = "claude_usage"
title = "Claude Usage"
placement = "split"
command = ["node", "dist/index.js"]
