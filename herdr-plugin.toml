id = "claude-usage"
name = "Claude Usage"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Display AI agent usage (Claude, Codex, Gemini, OpenCode…) at the bottom of Herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "install"]
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "run", "build"]
platforms = ["linux", "macos"]

# Background updater: pushes usage into the sidebar as pane/workspace metadata
# tokens ($usage). Disable with "sidebar": { "enabled": false } in the plugin config.
[[startup]]
command = ["node", "dist/index.js", "--sidebar"]
platforms = ["linux", "macos"]

[[panes]]
id = "claude_usage"
title = "Agent usage"
placement = "split"
command = ["node", "dist/index.js"]
